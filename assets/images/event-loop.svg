<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">The Event Loop</text>

  <!-- Call stack -->
  <rect x="30" y="60" width="200" height="260" rx="8" fill="#1e293b"/>
  <text x="130" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#f7df1e">Call Stack</text>
  <rect x="50" y="260" width="160" height="34" rx="4" fill="#334155"/>
  <text x="130" y="282" text-anchor="middle" font-size="11" fill="#e2e8f0">main()</text>
  <rect x="50" y="220" width="160" height="34" rx="4" fill="#475569"/>
  <text x="130" y="242" text-anchor="middle" font-size="11" fill="#e2e8f0">loadUser()</text>
  <text x="130" y="200" text-anchor="middle" font-size="10" fill="#94a3b8">(runs one frame at a time)</text>

  <!-- Web APIs -->
  <rect x="290" y="60" width="200" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="390" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Web / Node APIs</text>
  <text x="390" y="108" text-anchor="middle" font-size="10.5" fill="#334155">setTimeout, fetch,</text>
  <text x="390" y="124" text-anchor="middle" font-size="10.5" fill="#334155">fs.readFile, DOM events</text>

  <!-- Microtask queue -->
  <rect x="290" y="170" width="200" height="70" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="390" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">Microtask Queue</text>
  <text x="390" y="213" text-anchor="middle" font-size="10.5" fill="#334155">resolved promises (.then)</text>

  <!-- Callback / task queue -->
  <rect x="290" y="260" width="200" height="70" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="390" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">Callback (Task) Queue</text>
  <text x="390" y="303" text-anchor="middle" font-size="10.5" fill="#334155">timers, I/O callbacks</text>

  <!-- Event loop circle -->
  <circle cx="610" cy="200" r="70" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="610" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b21a8">Event</text>
  <text x="610" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b21a8">Loop</text>

  <!-- arrows -->
  <line x1="230" y1="240" x2="288" y2="120" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="288,120 278,120 284,110" fill="#64748b"/>
  <text x="255" y="170" font-size="9.5" fill="#64748b">async call</text>

  <line x1="490" y1="205" x2="545" y2="205" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="545,205 535,200 535,210" fill="#64748b"/>

  <path d="M 610 270 C 610 300, 300 320, 232 300" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  <polygon points="232,300 242,296 240,306" fill="#a855f7"/>
  <text x="420" y="345" text-anchor="middle" font-size="10" fill="#6b21a8">queued callbacks run only once the call stack is empty</text>
</svg>
