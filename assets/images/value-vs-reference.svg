<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>

  <!-- Left panel: primitives -->
  <rect x="20" y="20" width="350" height="280" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="195" y="48" text-anchor="middle" font-size="15" font-weight="bold" fill="#713f12">Primitives — copied by value</text>
  <text x="195" y="66" text-anchor="middle" font-size="11" fill="#854d0e">let y = x;</text>

  <rect x="55" y="100" width="110" height="60" rx="6" fill="#facc15"/>
  <text x="110" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#422006">x</text>
  <text x="110" y="146" text-anchor="middle" font-size="13" fill="#422006">10</text>

  <rect x="230" y="100" width="110" height="60" rx="6" fill="#facc15"/>
  <text x="285" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#422006">y</text>
  <text x="285" y="146" text-anchor="middle" font-size="13" fill="#422006">10</text>

  <line x1="165" y1="130" x2="225" y2="130" stroke="#a16207" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="230,130 220,124 220,136" fill="#a16207"/>
  <text x="195" y="185" text-anchor="middle" font-size="10.5" fill="#713f12">value copied — independent memory</text>
  <text x="195" y="230" text-anchor="middle" font-size="11" fill="#713f12">x = 20; // y is still 10</text>

  <!-- Right panel: references -->
  <rect x="390" y="20" width="350" height="280" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="565" y="48" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Objects — copied by reference</text>
  <text x="565" y="66" text-anchor="middle" font-size="11" fill="#1e40af">let b = a;</text>

  <rect x="425" y="100" width="80" height="46" rx="6" fill="#60a5fa"/>
  <text x="465" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">a</text>

  <rect x="620" y="100" width="80" height="46" rx="6" fill="#60a5fa"/>
  <text x="660" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">b</text>

  <rect x="500" y="190" width="140" height="60" rx="6" fill="#1d4ed8"/>
  <text x="570" y="216" text-anchor="middle" font-size="12" fill="#dbeafe">{ value: 10 }</text>
  <text x="570" y="232" text-anchor="middle" font-size="10" fill="#bfdbfe">one shared object</text>

  <line x1="465" y1="146" x2="545" y2="190" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="545,190 533,186 540,198" fill="#1d4ed8"/>
  <line x1="660" y1="146" x2="595" y2="190" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="595,190 602,198 607,186" fill="#1d4ed8"/>

  <text x="565" y="278" text-anchor="middle" font-size="11" fill="#1e3a8a">a.value = 20; // b.value is also 20</text>
</svg>
