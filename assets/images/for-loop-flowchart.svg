<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="820" height="320" fill="#ffffff"/>

  <path d="M 685 232 C 685 20, 460 20, 460 80" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="460,78 454,66 466,66" fill="#64748b"/>

  <rect x="20" y="110" width="110" height="46" rx="23" fill="#1e293b"/>
  <text x="75" y="138" text-anchor="middle" font-size="12" fill="#ffffff">Start</text>

  <line x1="130" y1="133" x2="165" y2="133" stroke="#64748b" stroke-width="2"/>
  <polygon points="165,133 155,127 155,139" fill="#64748b"/>

  <rect x="170" y="110" width="180" height="46" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="260" y="138" text-anchor="middle" font-size="12" fill="#1e3a8a">let i = 0 (run once)</text>

  <line x1="350" y1="133" x2="385" y2="133" stroke="#64748b" stroke-width="2"/>
  <polygon points="385,133 375,127 375,139" fill="#64748b"/>

  <polygon points="460,73 540,133 460,193 380,133" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="460" y="129" text-anchor="middle" font-size="11" fill="#713f12">i &lt; length?</text>
  <text x="460" y="146" text-anchor="middle" font-size="10" fill="#854d0e">(condition)</text>

  <line x1="540" y1="133" x2="585" y2="133" stroke="#64748b" stroke-width="2"/>
  <polygon points="585,133 575,127 575,139" fill="#64748b"/>
  <text x="562" y="120" text-anchor="middle" font-size="10.5" fill="#991b1b">false</text>

  <rect x="590" y="110" width="110" height="46" rx="23" fill="#1e293b"/>
  <text x="645" y="138" text-anchor="middle" font-size="12" fill="#ffffff">End</text>

  <line x1="460" y1="193" x2="460" y2="228" stroke="#64748b" stroke-width="2"/>
  <polygon points="460,228 454,218 466,218" fill="#64748b"/>
  <text x="480" y="215" text-anchor="middle" font-size="10.5" fill="#166534">true</text>

  <rect x="380" y="232" width="180" height="46" rx="6" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="470" y="260" text-anchor="middle" font-size="12" fill="#14532d">run loop body</text>

  <line x1="560" y1="255" x2="595" y2="255" stroke="#64748b" stroke-width="2"/>
  <polygon points="595,255 585,249 585,261" fill="#64748b"/>

  <rect x="600" y="232" width="170" height="46" rx="6" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="685" y="260" text-anchor="middle" font-size="12" fill="#14532d">i++ (increment)</text>
</svg>
