<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="480" height="520" fill="#ffffff"/>

  <rect x="140" y="20" width="140" height="46" rx="23" fill="#1e293b"/>
  <text x="210" y="48" text-anchor="middle" font-size="12" fill="#ffffff">Start</text>

  <line x1="210" y1="66" x2="210" y2="96" stroke="#64748b" stroke-width="2"/>
  <polygon points="210,96 204,86 216,86" fill="#64748b"/>

  <rect x="110" y="100" width="200" height="46" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="210" y="128" text-anchor="middle" font-size="12" fill="#1e3a8a">let i = 0 (run once)</text>

  <line x1="210" y1="146" x2="210" y2="176" stroke="#64748b" stroke-width="2"/>
  <polygon points="210,176 204,166 216,166" fill="#64748b"/>

  <polygon points="210,180 290,225 210,270 130,225" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="210" y="221" text-anchor="middle" font-size="11" fill="#713f12">i &lt; length?</text>
  <text x="210" y="238" text-anchor="middle" font-size="10" fill="#854d0e">(condition)</text>

  <line x1="210" y1="270" x2="210" y2="300" stroke="#64748b" stroke-width="2"/>
  <polygon points="210,300 204,290 216,290" fill="#64748b"/>
  <text x="225" y="288" font-size="10.5" fill="#166534">true</text>

  <rect x="110" y="304" width="200" height="46" rx="6" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="210" y="332" text-anchor="middle" font-size="12" fill="#14532d">run loop body</text>

  <line x1="210" y1="350" x2="210" y2="380" stroke="#64748b" stroke-width="2"/>
  <polygon points="210,380 204,370 216,370" fill="#64748b"/>

  <rect x="110" y="384" width="200" height="46" rx="6" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="210" y="412" text-anchor="middle" font-size="12" fill="#14532d">i++ (increment)</text>

  <path d="M 110 407 C 20 407, 20 225, 128 225" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="130,225 118,220 118,230" fill="#64748b"/>

  <line x1="290" y1="225" x2="340" y2="225" stroke="#64748b" stroke-width="2"/>
  <polygon points="340,225 330,220 330,230" fill="#64748b"/>
  <text x="305" y="215" font-size="10.5" fill="#991b1b">false</text>

  <rect x="300" y="440" width="140" height="46" rx="23" fill="#1e293b"/>
  <text x="370" y="468" text-anchor="middle" font-size="12" fill="#ffffff">End</text>
  <path d="M 340 225 C 400 225, 400 350, 370 438" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="370,438 364,428 376,428" fill="#64748b"/>
</svg>
