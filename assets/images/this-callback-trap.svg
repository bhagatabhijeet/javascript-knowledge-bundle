<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="480" fill="#ffffff"/>

  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">The callback trap: a function inside a method is not itself a method</text>

  <!-- Panel A: broken -->
  <rect x="30" y="42" width="700" height="180" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="380" y="64" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7f1d1d">Without passing this — the callback loses it</text>

  <text x="55" y="90" font-size="13.5" fill="#1f2937" xml:space="preserve">showTags() {</text>
  <text x="75" y="112" font-size="13.5" fill="#1f2937" xml:space="preserve">this.tags.forEach(function (tag) {</text>
  <text x="95" y="134" font-size="13.5" fill="#1f2937" xml:space="preserve">console.log(this);</text>
  <text x="75" y="156" font-size="13.5" fill="#1f2937" xml:space="preserve">});</text>
  <text x="55" y="178" font-size="13.5" fill="#1f2937" xml:space="preserve">}</text>

  <line x1="180" y1="106" x2="565" y2="106" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="600" y="111" font-size="12.5" font-weight="bold" fill="#166534">this = video &#10003;</text>

  <line x1="290" y1="128" x2="565" y2="128" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="600" y="133" font-size="12.5" font-weight="bold" fill="#7f1d1d">this = window &#10005;</text>

  <text x="380" y="200" text-anchor="middle" font-size="11.5" fill="#7f1d1d">forEach calls this function on its own, as a plain function — not as video.something()</text>

  <!-- Panel B: fixed -->
  <rect x="30" y="238" width="700" height="180" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="380" y="260" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">Fixed — pass this as forEach's second argument</text>

  <text x="55" y="286" font-size="13.5" fill="#1f2937" xml:space="preserve">showTags() {</text>
  <text x="75" y="308" font-size="13.5" fill="#1f2937" xml:space="preserve">this.tags.forEach(function (tag) {</text>
  <text x="95" y="330" font-size="13.5" fill="#1f2937" xml:space="preserve">console.log(this);</text>
  <text x="75" y="352" font-size="13.5" fill="#1f2937" xml:space="preserve">}, this);</text>
  <text x="55" y="374" font-size="13.5" fill="#1f2937" xml:space="preserve">}</text>

  <line x1="180" y1="302" x2="565" y2="302" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="600" y="307" font-size="12.5" font-weight="bold" fill="#166534">this = video &#10003;</text>

  <line x1="290" y1="324" x2="565" y2="324" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="600" y="329" font-size="12.5" font-weight="bold" fill="#166534">this = video &#10003;</text>

  <path d="M 130 348 C 130 400, 500 400, 500 330" fill="none" stroke="#16a34a" stroke-width="1.5"/>
  <polygon points="500,330 493,340 508,340" fill="#16a34a"/>
  <text x="380" y="400" text-anchor="middle" font-size="11.5" fill="#14532d">the trailing `, this` is forEach's "thisArg" — it tells forEach what this should be inside the callback</text>
</svg>
